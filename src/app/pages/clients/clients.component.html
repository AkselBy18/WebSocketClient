<div class="row vertical-center">
    <div class="col-10">
        <div class="row vertical-center ms-5">
            <h3 class="col-2 ms-5 section-title">
                Clients
            </h3>
            <img
                src="/icons/reload.png"
                alt=""
                class="icon-reload">
        </div>
        <div
            class="col-12 mt-4 scroll ps-4"
            style="transform: translateX(21%)">
            <!-- LIST CLIENTS -->
            <div
                *ngFor="let row of clients"
                class="row col-7 cell-row">
                <div class="row">
                    <h5 class="col mb-0">{{row.name}}</h5>
                    <p class="col mb-0 text-end text-gray">{{ row.phone }}</p>
                </div>
                <div class="row mt-1">
                    <h6 class="col m-0 text-gray">
                        {{row.email}}
                    </h6>
                    <div
                        class="row col align-end actions-box">
                        <button
                            class="btn-action me-2 edit"
                            [class.confirm]="row.deleting"
                            (click)="row.deleting ? deleteClient(row) : setEditClient(row)">
                            <img
                                src="/icons/{{row.deleting ? 'done.png' : 'edit.png'}}"
                                alt="">
                        </button>
                        <button
                            class="btn-action delete"
                            (click)="row.deleting = !row.deleting">
                            <img
                                src="/icons/{{ row.deleting ? 'cancel.png' : 'delete.png' }}"
                                alt="">
                        </button>
                    </div>
                </div>
            </div>
            <!-- CELL ADD -->
            <div
                #cellAdd
                class="row col-7 cell-client mb-2"
                >
                <div class="row">
                    <div class="col">
                        <input
                            class="col-5 form-control"
                            type="text"
                            placeholder="Nombre"
                            [(ngModel)]="currentClient.name">
                    </div>
                    <div class="col">
                        <input
                            class="col-5 form-control"
                            type="text"
                            placeholder="Teléfono"
                            [(ngModel)]="currentClient.phone">
                    </div>
                </div>
                <div class="row mt-2">
                    <div class="col">
                        <input
                            class="col-7 form-control"
                            type="text"
                            placeholder="Correo electrónico"
                            [(ngModel)]="currentClient.email">
                    </div>
                    <div class="col text-end">
                        <button
                            class="btn-save"
                            (click)="sendRequest()">
                            <img
                                src="/icons/done.png"
                                alt="">
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-12 text-center">
            <button
                class="btn btn-add add-client"
                [class.btn-cancel]="showCellAdd"
                (click)="addClient()">
                <img
                    src="/icons/add.png"
                    alt="">
            </button>
        </div>
    </div>
</div>
